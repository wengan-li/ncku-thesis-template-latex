name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version. Leave empty for dev-<short-sha>; release versions use vMAJOR.MINOR.PATCH.YYMMDDhhmmss (UTC)."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        shell: bash
        # Pass the dispatch input through the environment instead of literal
        # ${{ }} interpolation so it cannot inject into the shell script.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          if [[ "$VERSION" != dev-* ]]; then
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{12}$ ]]; then
              echo "Invalid release version: $VERSION" >&2
              echo "Expected vMAJOR.MINOR.PATCH.YYMMDDhhmmss using UTC." >&2
              exit 1
            fi
            python3 - "${VERSION##*.}" <<'PY'
          import datetime
          import sys

          datetime.datetime.strptime(sys.argv[1], "%y%m%d%H%M%S")
          PY
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check committed whitespace
        # A merge commit has an empty combined diff, so `git show --check`
        # validates nothing there. Diff against the mainline parent instead.
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --check HEAD^1 HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Build and verify release assets
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          os: alpine
          scheme: full
          run: |
            apk add --no-cache git just poppler-utils unzip zip
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            just release "${{ env.VERSION }}"

      - name: Check exact release artifact paths
        shell: bash
        run: |
          test -s "build/release/ncku-thesis-template-latex-${VERSION}.zip"
          test -s "build/release/ncku-thesis-template-latex-examples-${VERSION}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ env.VERSION }}
          path: |
            build/release/ncku-thesis-template-latex-${{ env.VERSION }}.zip
            build/release/ncku-thesis-template-latex-examples-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Attach verified assets to GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    # Only this job publishes; the build job keeps the read-only default.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate tag version
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{12}$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          python3 - "${VERSION##*.}" <<'PY'
          import datetime
          import sys

          datetime.datetime.strptime(sys.argv[1], "%y%m%d%H%M%S")
          PY
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download verified workflow artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ env.VERSION }}
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          assets=(release-artifacts/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
