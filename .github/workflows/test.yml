name: Test

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed whitespace
        # A merge commit (pull_request merge ref, PR merges to main) has an
        # empty combined diff, so `git show --check` validates nothing there.
        # Diff the merge result against the mainline parent instead.
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --check HEAD^1 HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Run required test gate
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          os: alpine
          scheme: full
          run: |
            apk add --no-cache git just poppler-utils unzip zip
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            just test

      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thesis-test-output
          path: |
            build/thesis.pdf
            build/thesis.log
          if-no-files-found: warn
          retention-days: 7
