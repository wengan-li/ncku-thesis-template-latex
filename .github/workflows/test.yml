name: Test

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check committed whitespace
        # A merge commit (pull_request merge ref, PR merges to main) has an
        # empty combined diff, so `git show --check` validates nothing there.
        # Diff the merge result against the mainline parent instead.
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --check HEAD^1 HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Run required test gate
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          os: alpine
          scheme: full
          run: |
            apk add --no-cache git poppler-utils unzip zip
            # Pin just: the [parallel] gate attribute needs >= 1.42 and the
            # Alpine stable repository can lag behind that.
            wget -qO /tmp/just.tar.gz "https://github.com/casey/just/releases/download/1.57.0/just-1.57.0-x86_64-unknown-linux-musl.tar.gz"
            echo "45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155  /tmp/just.tar.gz" | sha256sum -c -
            tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            JUST_JOBS=4 just test

      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thesis-test-output
          path: |
            build/thesis.pdf
            build/thesis.log
          if-no-files-found: warn
          retention-days: 7
